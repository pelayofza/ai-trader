<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Trader Dashboard</title><style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4; --s4:#eda100; --s5:#1baf7a;
  --s6:#eb6834; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
a{color:var(--s1)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;margin:0 0 2px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.nav{list-style:none;padding:0;margin:14px 0 0}
.nav li{margin:2px 0}
.nav button{width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  padding:8px 12px 8px 22px;border-radius:8px;cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--plane)}
.nav button.active{background:var(--s1);color:#fff;font-weight:600}
/* Capitulos: la nav es de dos niveles porque la documentacion tambien lo es, y las dos
   tienen que poder leerse en el mismo orden. */
.nav li.chap{margin:16px 0 3px;padding:0 12px;color:var(--muted);font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.nav li.chap:first-child{margin-top:2px}
.nav li.chap b{color:var(--ink2)}
/* El capitulo archivado se separa del resto y se apaga: sigue ahi -lo medido no se borra-
   pero no es donde se trabaja. */
.nav li.chap.arch{margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
.nav li.chap.arch ~ li button{opacity:.6}
.nav li.chap.arch ~ li button.active{opacity:1}
.archnote{border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:8px;
  padding:11px 13px;margin:0 0 16px;background:var(--surface);color:var(--ink2);font-size:13px}
.archnote b{color:var(--ink)}
.crumb{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;
  font-weight:600;margin:0 0 4px}
.main{padding:26px 32px;max-width:1180px;overflow-x:hidden}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:30px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.lead{color:var(--ink2);margin:0 0 18px;max-width:78ch}
.section{display:none}
.section.active{display:block}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:26px;font-weight:700;margin-top:4px}
.tile .s{color:var(--ink2);font-size:12px;margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.chip.tendencia{background:color-mix(in srgb,var(--s1) 18%,transparent);color:var(--s1)}
.chip.reversion{background:color-mix(in srgb,var(--s7) 22%,transparent);color:var(--s7)}
.chip.mixto{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
.chip.alto{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.chip.medio{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.bajo{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
.chip.pendiente{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.hecho{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.chip.pend{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.chip.placeholder{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.mbar{height:9px;border-radius:4px;background:var(--s1);display:inline-block;vertical-align:middle}
.mbar.v1{background:var(--muted)}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px}
.btn{background:var(--s1);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--border)}
.btn:hover{filter:brightness(1.06)}
.toggle{position:absolute;top:20px;right:20px}
.tag{color:var(--muted);font-size:12px}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);margin:8px 0 16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.prompt{background:var(--plane);border:1px solid var(--border);border-radius:8px;padding:11px;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;color:var(--ink2);max-height:150px;overflow:auto;margin:10px 0}
.rowbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scenlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding-right:6px}
.scenitem{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer}
.scenitem:hover{border-color:var(--s1)}
.scenitem.active{border-color:var(--s1);box-shadow:0 0 0 1px var(--s1) inset}
.scenitem .t{font-weight:600}
.split{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.chart-tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:9;display:none}
svg{max-width:100%;display:block}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-right:4px}
/* --- evoluciones: lista ordenada por criticidad --- */
.rmgroup{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
.rmgroup:first-of-type{border-top:0;padding-top:0;margin-top:18px}
.rmgroup h2{margin:0 0 2px}
.rmgroup .sub{color:var(--ink2);font-size:13px;margin:0 0 14px;max-width:82ch}
.rmlist{display:flex;flex-direction:column;gap:12px}
.rmitem{--pc:var(--muted);display:grid;grid-template-columns:52px 1fr;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--pc);
  border-radius:12px;padding:14px 16px}
.rmitem.critica{--pc:var(--crit)}
.rmitem.alta{--pc:var(--serious)}
.rmitem.media{--pc:var(--warn)}
.rmitem.baja{--pc:var(--s1)}
.rmitem.aparcada{--pc:var(--muted)}
.rmitem.retirada{--pc:var(--muted);opacity:.72}
.rmrank{text-align:center;line-height:1.05;padding-top:2px}
.rmrank b{font-size:24px;font-weight:700;color:var(--pc);font-variant-numeric:tabular-nums}
.rmrank small{display:block;margin-top:3px;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.rmhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.rmhead h3{margin:0;font-size:15.5px}
.rmev{border-left:3px solid var(--pc);padding:3px 0 3px 11px;margin:9px 0;color:var(--ink2);font-size:12.5px}
.rmwhy{color:var(--ink2);margin:4px 0 0;max-width:82ch}
details.pr{margin:10px 0 0}
details.pr summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--s1);list-style:none;padding:3px 0}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary:before{content:'▸ '}
details.pr[open] summary:before{content:'▾ '}
details.pr .prompt{max-height:340px}
.chip.critica{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.chip.alta{background:color-mix(in srgb,var(--serious) 30%,transparent);color:var(--serious)}
.chip.media{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.baja{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.chip.bloqueada{background:color-mix(in srgb,var(--s7) 20%,transparent);color:var(--s7)}
.chip.aparcada{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
.chip.retirada{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.split{grid-template-columns:1fr}
  .rmitem{grid-template-columns:1fr}.rmrank{text-align:left;display:flex;gap:8px;align-items:baseline}
  .rmrank small{margin:0}}
</style></head><body>

operaciones (< 3)"], "mean_reversion#02": ["la ventana mediana tiene 1.00 operaciones (< 3)", "35.8% de ventanas vacias (> 25%)"], "mean_reversion#04": ["la ventana mediana tiene 1.00 operaciones (< 3)", "49.2% de ventanas vacias (> 25%)"], "mean_reversion#07": ["la ventana mediana tiene 0.00 operaciones (< 3)", "67.5% de ventanas vacias (> 25%)"]}}}}, "verdict": {"key": "sin_transferencia", "rho": -0.0382, "threshold": 0.3, "decision": "|rho| = 0.038 < 0.30", "flow": "no se disenan estrategias contra el sintetico: el ranking lo fija el historico real y el sintetico se queda como banco de estres, nunca como criterio de seleccion", "ci_excludes_zero": false, "transfers": false}, "caveats": [{"key": "inactividad_premiada", "title": "El CVaR premia no operar, y por eso el ranking tiene un suelo", "text": "Una configuracion que apenas abre posiciones deja la curva plana: Sharpe 0, rotacion 0, caida 0, headline 0 EXACTO. En un periodo en el que casi todo lo que arriesga pierde, ese cero gana. La correlacion entre recompensa y operaciones por ventana lo mide: -0.8447 en el real y -0.0868 en el sintetico. La respuesta NO es penalizar la baja rotacion (eso ya lo hace lambda, y el estudio de pesos midio que no estabiliza nada) sino un REQUISITO DE ELEGIBILIDAD: para entrar en el ranking hay que operar al menos 3 veces en la ventana mediana y tener como mucho un 25% de ventanas vacias (ver scoring.activity). En el lado real eso deja 9 de 16 configuraciones, cambia al ganador de mean_reversion#07 a crypto_momentum#00 y reduce los aprobados del gate de 7 a 1. Las que caen conservan su recompensa publicada: no se les resta nada, se les niega competir. El rho restringido a las 9 configuraciones que operan de verdad en los dos mundos es -0.6667. Al quitar la inactividad el acuerdo no aparece: se vuelve NEGATIVO. Entre configuraciones que actuan de verdad, el sintetico tiende a invertir el orden del mercado, asi que el veredicto de arriba no es un artefacto de las inactivas —es, si ucion que el motor ya cobra por entrar (15.0 pb de referencia, comision mas deslizamiento plano). Frente a ese, llegar una hora tarde cuesta 3.9x. El backtest supone ejecucion instantanea a las 00:00 UTC; esa suposicion no sesga el precio -el hueco es cero- pero pone un techo a la puntualidad con la que el ciclo real tiene que ejecutar para que el backtest siga describiendolo."}, "trend": {"key": "us_crece", "text": "La DIRECCION de la hipotesis se sostiene: la cuota estadounidense de varianza sube 7.64% de media entre el antes y el despues de 2024-01-01, en 10 de 10 pares (test de signos p = 0.002). Su MECANISMO, en cambio, NO: la cuota ya venia subiendo antes del corte (Spearman ano-cuota = +0.80 sobre 2020-2023, por encima del umbral declarado de 0.60) y el escalon del ultimo ano previo al primero posterior es -2.29%. Es una DERIVA de varios anos que el corte parte por la mitad, no un salto atribuible a lo que paso en enero de 2024. El contraste pre/post mide la pendiente acumulada; leerlo como efecto del mecanismo seria atribuirle credito ajeno."}}, "caveats": [{"key": "sesiones_desiguales", "title": "Las tres sesiones no duran lo mismo", "text": "Cortar el dia por aperturas reales da tramos de 7 h (asiática), 6 h (europea), 11 h (estadounidense). Una cuota bruta mayor puede significar solo 'dura mas'. Por eso toda cuota va acompanada de su intensidad (cuota / fraccion de reloj), que es lo unico comparable entre tramos; 1,0 es neutro."}, {"key": "solape_de_sesiones", "title": "Las sesiones reales se solapan; la particion no puede", "text": "Londres y Nueva York coinciden varias horas al dia, y ese solape es precisamente el tramo mas activo del calendario financiero. Una particion exhaustiva y disjunta -que es lo que hace falta para que las cuotas sumen 1- tiene que asignar esas horas a UNA sesion. Aqui van a la estadounidense, porque el corte se pone en la apertura de EE.UU. La consecuencia es que la cuota estadounidense incorpora el solape y la europea no: es una decision, no una medida."}, {"key": "sin_horario_de_verano", "title": "Los cortes no se mueven con el horario de verano", "text": "Los mercados de referencia cambian de hora UTC dos veces al ano; los cortes de este estudio no. Desplazarlos haria que la serie de cuotas midiera tambien el calendario civil, y ademas la rejilla de velas del exchange es UTC fija. El coste es que durante el invierno del hemisferio norte la primera hora de cada sesion occidental cae en el tramo anterior; se ha elegido la frontera MAS TEMPRANA justo para que el error vaya en esa direccion y nunca en la contraria (una sesion no contiene la apertura de la siguiente)."}, {"key": "un_solo_exchange", "title": "Un solo exchange (binance) y un solo quote (USDT)", "text": "Todo esto es el libro de un exchange concreto en pares contra USDT. La distribucion horaria de la actividad puede diferir en plataformas con otra base de usuarios (una regulada en EE.UU. cargaria mas la sesion estadounidense por construccion). La cifra es del sustrato sobre el que el sistema opera y se backtestea, que es lo que se queria medir, pero no es 'el mercado' en abstracto."}, {"key": "cohorte_equilibrada", "title": "La tendencia se mide sobre una cohorte, no sobre el universo", "text": "10 de 24 pares cubren todos los anos de la ventana con al menos 240 dias utilizables. La serie anual y el contraste pre/post se calculan SOLO sobre ellos. Con el universo completo, la cuota de 2024 incorporaria pares que no existian en 2020 y la 'tendencia' seria en parte la historia de que se listo cuando. Los pares fuera de la cohorte se publican igual en la tabla por simbolo y ano."}, {"key": "sesgo_supervivencia", "title": "Sesgo de supervivencia", "text": "Los pares son los que cotizan HOY en el universo operable. Los deslistados entre 2020 y 2025 no estan. Para una descomposicion horaria el sesgo es menos grave que para un backtest -no se esta midiendo rentabilidad- pero sigue siendo un universo seleccionado por haber sobrevivido."}, {"key": "dias_incompletos", "title": "Los dias incompletos se caen enteros", "text": "Un dia entra solo si tiene sus 24 barras y ademas existe la de las 23:00 del dia anterior. Las paradas de mantenimiento del exchange tienden a caer en horas de poca actividad, asi que descartar el dia entero es mas conservador que rellenarlo: rellenar inventaria justo el dato que se quiere medir. Cada simbolo declara cuantos dias ha perdido."}, {"key": "no_es_causal", "title": "Esto describe cuando se mueve el precio, no por que", "text": "Una cuota horaria no identifica quien opera. Que la actividad se concentre en horario estadounidense es compatible con flujo institucional local, con el solape de Londres, con la publicacion de datos macro de EE.UU. y con que los tres coincidan. El estudio mide el CUANDO, que es lo que el motor necesita saber; el porque exigiria datos que no estan en una vela."}], "leader_variance": {"key": "us", "label": "Estadounidense", "value": 0.489}, "leader_sets_low": {"key": "us", "label": "Estadounidense", "value": 0.4766}, "us": {"abs_return": 0.4785, "variance": 0.489, "range": 0.4211, "range_vs_daily": 0.7242, "abs_intensity": 1.044, "variance_intensity": 1.067, "sets_high": 0.4506, "sets_low": 0.4766}, "us_key": "us", "generated_at": "2026-08-11"}, "activity": {"library": "ai_v3", "source": {"units": "data\\transfer\\units_ai_v3.json", "library_id": "ai_v3", "n_configs": 16, "cvar_alpha": 0.25, "blocks": {"real": 5, "synthetic": 8}, "windows_per_block": 15}, "floor": {"min_median_trades_per_window": 3.0, "max_zero_window_pct": 25.0, "derived": {"max_zero_window_pct": "es alpha en porcentaje: por encima de esa fraccion de ventanas vacias, el cuartil que promedia el CVaR puede estar hecho de ceros estructurales"}}, "mechanism": {"sides": {"real": {"windows": 1200, "empty_windows": 307, "empty_windows_scoring_exactly_zero": 307, "non_empty_windows_scoring_exactly_zero": 0, "holds": true, "cvar_tail_windows": 304, "cvar_tail_empty_windows": 37, "cva ue ademas reusan calendario. Por eso el intervalo es un bootstrap por bloques y no iid: con 5 bloques reales sale ancho, y esa anchura es la verdad disponible, no un defecto del metodo."}, {"key": "sesgo_supervivencia", "title": "Sesgo de supervivencia en el lado real", "text": "Los simbolos son los que cotizan HOY en el universo operable: los pares deslistados o muertos entre 2018 y 2025 no estan en ninguna parte, y el generador sintetico no tiene ese filtro. El sesgo juega A FAVOR del lado real (su historia esta seleccionada por haber sobrevivido) y por tanto EN CONTRA de la hipotesis que este estudio quiere validar: introduce una diferencia sistematica entre los dos mundos que solo puede bajar el rho."}, {"key": "historico_insuficiente", "title": "Simbolos omitidos por historico insuficiente", "text": "13 pares del universo operable quedan fuera y 11 entran. El criterio no es a ojo: hacen falta 270 dias de barras dentro de la ventana (calentamiento de la estrategia mas un grupo de CPCV), porque por debajo de eso el par no llega a operarse ni en una sola ventana OOS. Los omitidos se DECLARAN con su recuento y sus fechas; no se rellenan ni se sustituyen, porque un par listado hace unos meses no tiene 2018 y fabricarselo seria inventar el dato que se quiere medir."}, {"key": "cobertura_creciente", "title": "El universo real crece con el tiempo; el sintetico no", "text": "Varios de los pares que si entran empiezan a cotizar a mitad de la ventana, asi que las sub-ventanas antiguas se operan con menos activos que las recientes. En el mundo sintetico los 11 activos existen desde el primer dia. Es una diferencia estructural entre los dos lados que no se puede eliminar sin tirar la mitad del historico."}, {"key": "rejilla_pequena", "title": "16 configuraciones, y de solo dos familias", "text": "Una correlacion de rangos sobre 16 puntos tiene un error de muestreo grande: sirve para distinguir 'ordena como el mercado' de 'no ordena', no para comparar 0,35 con 0,45. Ademas la rejilla es un hipercubo latino sobre el espacio de busqueda, no la distribucion que el CEM visita de verdad al converger; la transferencia medida es la del espacio, no la de la region final del optimizador."}, {"key": "folds_dependientes", "title": "Los folds de CPCV no son independientes", "text": "C(6, 2) = 15 ventanas salen de reusar los mismos tramos de calendario en combinaciones distintas. Cuentan como evidencia sobre la estabilidad del resultado, no como observaciones independientes; el bootstrap por bloques es justo lo que impide tratarlas como tales."}, {"key": "cabecera_descartada", "title": "La cabecera del historico se descarta", "text": "324 dias iniciales no completan una sub-ventana del tamano de un camino sintetico y quedan fuera. El corte se hace por el principio a proposito (es el tramo con menos pares vivos), y se declara porque cambia que anos entran en la comparacion."}], "baselines": {"real": {"btc_hold": -1.4221, "equal_weight": -1.3904}, "synthetic": {"btc_hold": -1.008, "equal_weight": -1.0564}, "missing": ["spy_hold"]}, "leakage": {"folds_audited": 12480, "clean": true}, "generated_at": "2026-08-14"}, "activity_v4": {"library": "ai_v4", "source": {"units": "data\\transfer\\units_ai_v4.json", "library_id": "ai_v4", "n_configs": 64, "cvar_alpha": 0.25, "blocks": {"real": 5, "synthetic": 8}, "windows_per_block": 15}, "floor": {"min_median_trades_per_window": 3.0, "max_zero_window_pct": 25.0, "derived": {"max_zero_window_pct": "es alpha en porcentaje: por encima de esa fraccion de ventanas vacias, el cuartil que promedia el CVaR puede estar hecho de ceros estructurales"}}, "mechanism": {"sides": {"real": {"windows": 4800, "empty_windows": 626, "empty_windows_scoring_exactly_zero": 626, "non_empty_windows_scoring_exactly_zero": 0, "holds": true, "cvar_tail_windows": 1216, "cvar_tail_empty_windows": 87, "cvar_tail_empty_pct": 7.15, "spearman_reward_activity": 0.0025}, "synthetic": {"windows": 7680, "empty_windows": 1297, "empty_windows_scoring_ tor": 10.0, "thinnest_source": "cex_listings", "thinnest_adv_usd": 247645.0, "venues": {"deribit": {"n_entities": 2, "n_traded": 2, "median_usd": 100937353.5, "p10_usd": 59922228.3, "max_usd": 152206260.0}, "hyperliquid": {"n_entities": 232, "n_traded": 177, "median_usd": 307369.6731919998, "p10_usd": 93596.971632, "max_usd": 1747619256.355627}, "upbit": {"n_entities": 283, "n_traded": 283, "median_usd": 247645.06152655507, "p10_usd": 39449.924907595465, "max_usd": 99003957.03119326}}}, "etf_dispersion": {"days": 663, "median": 1.17, "p95": 9.1, "rotation_days": 105}, "depth_measured_at": "2026-08-13", "sources": [{"key": "guavy_sentiment", "title": "Sentimiento social por token (Guavy)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "Comercial, plan gratuito. Bearer token.", "auth_env": "GUAVY_API_KEY", "features": ["sentiment_positive", "sentiment_negative", "sentiment_neutral", "sentiment_total"], "n_entities": 24, "connected": true, "notes": "Se consumen SOLO los conteos crudos. Los endpoints trend/signal son el output de SU modelo: pueden estar recalculados con informacion posterior y no son auditables (el adaptador los rechaza por codigo). El host esta MEDIDO: guavy.com responde 401 sin token y api.guavy.com da 404. Sin credencial en el entorno la sonda no pudo medir profundidad, y por eso history_from sigue a None.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": null, "archived_records": 0}, {"key": "etf_flows", "title": "Flujos diarios de los ETF spot (BTC/ETH), por emisor", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2024-01-11", "backtestable": true, "license": "TFTC: CC BY 4.0. Farside/SoSoValue como contraste.", "auth_env": null, "features": ["etf_netflow_usd", "etf_issuer_dispersion", "etf_issuers_reporting"], "n_entities": 24, "connected": true, "notes": "MEDIDO: solo BITCOIN. TFTC no publica dataset equivalente de ETH (las rutas evidentes dan 404), asi que ETH no tiene cobertura por esta puerta y NO se rellena con un agregado de otro sitio: sin desglose por emisor, etf_issuer_dispersion significaria otra cosa para ese activo. Los flujos se revisan al alza el dia siguiente, de ahi archive_revisable.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2024-01-11", "measured_to": "2026-08-10", "measured_days": 662, "measured_entities": 1, "measure_method": "archive", "measure_error": null, "archived_records": 684}, {"key": "fred_macro", "title": "Series macro de FRED (DXY, tipos reales, 2y/10y, oro, indices)", "tier": "B", "scope": "macro", "cadence": "daily", "entity_kind": "macro", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "FRED: uso publico, key gratuita.", "auth_env": "FRED_API_KEY", "features": ["macro_value", "macro_change_1d"], "n_entities": 9, "connected": true, "notes": "La entidad es la SERIE, no un activo, y cada una mapea sobre un factor del generador sintetico (adapters/fred.py::FACTOR_OF; universe.py: EQUITY, RATES, USD, COMMODITY). Las nueve existen: COMPROBADO. El ORO no esta y es una medicion, no un olvido: FRED discontinuo las series de la LBMA (GOLDAMGBD228NLBM da 404 hoy) y el factor COMMODITY se cubre con WTI. FRED revisa series hacia atras: sin el archivo crudo con fetched_at no hay forma de saber que se veia aquel dia. Sin FRED_API_KEY en el entorno la sonda no pudo medir profundidad.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": null, "archived_records": 0}, {"key": "defillama_stablecoins", "title": "Oferta de stablecoins por cadena (DefiLlama)", "tier": "B", "scope": "chain", "cadence": "daily", "entity_kind": "chain", "pit": "archive_revisable", "history_from": "2017-11-29", "backtestable": true, "license": "DefiLlama: abierta, sin auth.", "auth_env": null, "features": ["stablecoin_supply_usd", "stablecoin_issuance_usd"], "n_entities": 6, "connected": true, "notes": "La emision neta es polvora seca entrando; el desglose POR CADENA es rotacion de capital entre ecosistemas, que es la parte que no se publica agregada. La emision se deriva como VARIACION de la oferta: tras un hueco, el primer dia acumula lo emitido durante todo el hueco, y `observed` esta al lado para saber cuando fiarse.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2017-11-29", "measured_to": "2026-08-11", "measured_days": 12497, "measured_entities": 6, "measure_method": "archive", "measure_error": null, "archived_records": 12683}, {"key": "defillama_fees", "title": "Comisiones, ingresos y TVL por protocolo (DefiLlama)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2011-01-31", "backtestable": true, "license": "DefiLlama: abierta, sin auth.", "auth_env": null, "features": ["fees_usd", "revenue_usd", "tvl_usd"], "n_entities": 24, "connected": true, "notes": "Con el precio ya en el sistema salen P/F y P/S. El universo con ingresos reales es pequeno e ignorado, que es lo que lo hace interesante. Los 24 slugs estan COMPROBADOS: XRP y ATOM entran por su cadena (xrpl, cosmos-hub) porque el slug obvio da 400. La serie llega en tres llamadas (dailyFees, dailyRevenue, y el TVL del protocolo) marcadas en request.series.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2011-01-31", "measured_to": "2026-08-11", "measured_days": 54129, "measured_entities": 24, "measure_method": "archive", "measure_error": null, "archived_records": 118759}, {"key": "defillama_volumes", "title": "Cuota DEX/CEX por activo (DefiLlama)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2017-08-17", "backtestable": true, "license": "DefiLlama: abierta, sin auth. Pata CEX via CCXT (endpoints publicos).", "auth_env": null, "features": ["dex_volume_usd", "cex_volume_usd", "dex_share"], "n_entities": 24, "connected": true, "notes": "Donde se forma el precio. La cuota necesita las DOS patas y DefiLlama no publica volumen de CEX: la de CEX sale de CCXT y se archiva como un crudo mas, marcado en request.series. Solo estan las cadenas MEDIDAS: polkadot, celestia y cosmos devuelven 500, asi que DOT, TIA y ATOM no tienen pata DEX. Un activo cuyo volumen migra a DEX cambia de microestructura y el modelo de costes lo trata igual (limite conocido).", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2017-08-17", "measured_to": "2026-08-11", "measured_days": 30590, "measured_entities": 14, "measure_method": "archive", "measure_error": null, "archived_records": 53234}, {"key": "wikipedia_pageviews", "title": "Atencion por idioma (Wikipedia Pageviews)", "tier": "B", "scope": "asset", "cadence": "hourly", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2015-07-01", "backtestable": true, "license": "Wikimedia REST: CC BY-SA, sin auth.", "auth_env": null, "features": ["pageviews", "pageviews_lang_concentration"], "n_entities": 24, "connected": true, "notes": "Desglosado por idioma, que es lo que Google Trends no da limpio: seis proyectos (en/es/de/ja/ru/zh) dan una descomposicion geografica de la atencion. Dos limites MEDIDOS: el User-Agent generico se come un 403 y el limite de peticiones salta a 429 incluso en serie a 0,7 s, asi que el adaptador va secuencial con pausa de 2 s. Los titulos son una TABLA (el articulo de SOL es 'Solana (blockchain platform)'), comprobada uno a uno: lo que daba 404 no esta.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2015-07-01", "measured_to": "2026-08-10", "measured_days": 36024, "measured_entities": 15, "measure_method": "archive", "measure_error": null, "archived_records": 127000}, {"key": "p2p_premium", "title": "Prima P2P en monedas en crisis (Binance P2P)", "tier": "B", "scope": "venue", "cadence": "hourly", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Endpoint publico de Binance. Tipo oficial: open.er-api.com (abierto).", "auth_env": null, "features": ["p2p_premium_pct", "p2p_currencies"], "n_entities": 1, "connected": true, "notes": "TRY/ARS/NGN contra USDT (MEDIDO: TRY y ARS tienen libro lleno, NGN devuelve cero anuncios y por eso p2p_currencies vale 2). Demanda por crisis monetaria: un driver distinto y no correlacionado con el ciclo especulativo. Cada registro crudo guarda el libro Y el tipo oficial del mismo momento, porque la prima es un cociente y ninguna de las dos patas se puede re-descargar con fecha pasada. NADIE publica el historico de un libro P2P: lo que no se capture hoy no existe manana, y por eso la profundidad crece un dia por dia real.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2026-08-11", "measured_to": "2026-08-11", "measured_days": 1, "measured_entities": 1, "measure_method": "archive", "measure_error": null, "archived_records": 8}, {"key": "funding_dispersion", "title": "Dispersion de funding entre venues (CCXT)", "tier": "B", "scope": "venue", "cadence": "hourly", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Endpoints publicos de cada venue via CCXT.", "auth_env": null, "features": ["funding_dispersion", "funding_median", "funding_venues"], "n_entities": 24, "connected": true, "notes": "La DISPERSION, no el nivel: el nivel esta muy arbitrado. Los tres venues estan MEDIDOS (los tres devolvieron funding de BTC/USDT:USDT). La dispersion se calcula ENTRE VENUES en cada ventana de funding y solo despues se promedia el dia: al reves mediria la variacion horaria, que es otra cosa. Se exigen 3 venues como minimo. fetch_funding_rate da la foto de AHORA, asi que la profundidad crece con la captura.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2026-08-11", "measured_to": "2026-08-11", "measured_days": 24, "measured_entities": 24, "measure_method": "archive", "measure_error": null, "archived_records": 47}, {"key": "github_activity", "title": "Velocidad de desarrollo (GitHub API)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2009-08-23", "backtestable": true, "license": "GitHub API, token gratuito (rate limit 5000/h).", "auth_env": "GITHUB_TOKEN", "features": ["commits", "contributors"], "n_entities": 24, "connected": true, "notes": "Santiment cobra por esto y el dato crudo es publico. LAS DOS FEATURES NO TIENEN LA MISMA PROFUNDIDAD, y por eso hay que decirlo aqui: history_from (2009, la creacion del repo mas viejo) la alcanza contributors, que llega con cubos semanales desde el principio; commits solo tiene 52 semanas por captura, asi que hacia atras es NaN —no cero— y la historia larga se acumula captura a captura en el archivo. commit_activity reparte la semana en curso en siete dias incluidos los que AUN NO HAN PASADO: la capa 2 los corta con el fetched_at del registro, porque un cero en un dia que no ha ocurrido no es 'no hubo commits'. contributors es SEMANAL y se ancla al inicio de su semana; repetirlo siete veces convertiria una observacion en siete. Sin GITHUB_TOKEN son 60 peticiones/hora y el universo necesita 48: la sonda se quedo sin cuota en el primer intento (medido). contributors es SEMANAL y se ancla al inicio de su semana; repetirlo siete veces convertiria una observacion en siete. El 202 con cuerpo vacio (GitHub calculando) se trata como 'hoy no hay dato'. Revisable: un force-push reescribe el historico de commits.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2009-08-23", "measured_to": "2026-08-11", "measured_days": 15877, "measured_entities": 24, "measure_method": "archive", "measure_error": null, "archived_records": 33276}, {"key": "cftc_cot", "title": "Posicionamiento en futuros CME (CFTC COT / TFF)", "tier": "B", "scope": "asset", "cadence": "weekly", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2018-04-13", "backtestable": true, "license": "CFTC: dominio publico (Socrata).", "auth_env": null, "features": ["cot_leveraged_net", "cot_dealer_net", "cot_open_interest"], "n_entities": 24, "connected": true, "notes": "Semanal: foto del MARTES, publicada el VIERNES. El dia con el que se archiva es el de PUBLICACION, no el de referencia —el martes queda en el payload—, porque el recorte por dia de observacion no ve un desfase de tres dias y fechar el martes meteria tres dias de futuro en cualquier cruce. Solo los dos contratos de CME con serie larga (BTC 435 semanas, ETH 279, medidas); los micro y los de otros exchanges quedan fuera para no sumar contratos de tamano distinto.", "encoding": "continua", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2018-04-13", "measured_to": "2026-08-07", "measured_days": 714, "measured_entities": 2, "measure_method": "archive", "measure_error": null, "archived_records": 722}, {"key": "token_unlocks", "title": "Desbloqueos y vesting (DefiLlama emissions)", "tier": "A", "scope": "asset", "cadence": "event", "entity_kind": "token", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "DefiLlama: el endpoint de emisiones dejo de ser abierto (402 medido).", "auth_env": null, "features": ["unlock_pct_float", "unlock_pct_adv"], "n_entities": 24, "connected": true, "notes": "Lo valioso NO es 'hay unlock' (explotado) sino el desbloqueo NORMALIZADO: un 3% sobre un token con 40 dias de volumen en circulacion es un evento; el mismo 3% sobre uno liquido no lo es. Esa normalizacion es ademas lo que permite agrupar: la unidad de observacion es el evento comparable entre activos, no el token. MEDIDO 2026-08-12: la API responde 402 Payment Required, asi que hoy no hay muestra que contar y history_from sigue a None. El adaptador existe para que eso sea una MEDICION y no un hueco. El calendario futuro se reescribe cuando el equipo cambia el vesting: revisable por naturaleza.", "encoding": "evento", "block": "activo", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": 0, "announced": true, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": "HTTP Error 402: Payment Required", "archived_records": 0}, {"key": "staking_queue", "title": "Cola de entrada/salida del staking (Ethereum)", "tier": "A", "scope": "chain", "cadence": "daily", "entity_kind": "chain", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "beaconcha.in: ahora exige credencial (401 medido).", "auth_env": "BEACONCHAIN_API_KEY", "features": ["staking_exit_queue", "staking_entry_queue"], "n_entities": 1, "connected": true, "notes": "Oferta futura con FECHA CONOCIDA dias antes. Tres correcciones MEDIDAS el 2026-08-12: (1) el endpoint devuelve 401 sin credencial, asi que la fuente declara auth_env y sin la variable en el entorno no hay medicion; (2) solo cubre Ethereum —Solana y Cosmos no tienen este endpoint— y por eso fixed_entities baja a una; (3) la espera en DIAS no se publica y no se estima: convertir la cola en dias exige el limite de churn vigente, que cambia con cada fork. Forward_capture puro: devuelve la foto de AHORA y no guarda la de ayer, el caso que mas penaliza retrasar la captura.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": "HTTP Error 401: Unauthorized", "archived_records": 0}, {"key": "btc_difficulty", "title": "Ajuste de dificultad de Bitcoin (mempool.space)", "tier": "A", "scope": "chain", "cadence": "event", "entity_kind": "chain", "pit": "chain_immutable", "history_from": "2014-08-19", "backtestable": true, "license": "mempool.space: abierta, sin auth.", "auth_env": null, "features": ["difficulty_change_pct"], "n_entities": 1, "connected": true, "notes": "LA HIPOTESIS DE 'DECENAS' ERA FALSA AQUI POR UN FACTOR DE DIEZ: 321 ajustes MEDIDOS en la ventana de la sonda (doce anos, 2014-08-19 en adelante), uno cada 2016 bloques. El limite lo pone PROBE_YEARS y no el proveedor: el endpoint devuelve los 463 retargets desde el bloque 0 (2009-01-03, COMPROBADO), y el catalogo declara lo medido, no lo disponible. Las cabeceras de bloque no se reescriben, de ahi el pit. El endpoint que se sondea no es el que estaba declarado: /difficulty-adjustment da la foto de AHORA y /mining/difficulty-adjustments/all da la serie entera en 21 KB. LIMITE DECLARADO: los dias-al-evento del pasado se cuentan contra la fecha en que el retarget OCURRIO, que aquel dia era una estimacion (bloques restantes x 10 min) con error de horas. El HASHPRICE queda fuera: exige una pata en USD que esta capa no tiene, y publicarlo a medias seria peor que no publicarlo.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": 321, "announced": true, "measured_from": "2014-08-19", "measured_to": "2026-08-08", "measured_days": 321, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 323}, {"key": "defillama_hacks", "title": "Hacks y exploits fechados (DefiLlama)", "tier": "A", "scope": "market", "cadence": "event", "entity_kind": "market", "pit": "archive_revisable", "history_from": "2016-06-17", "backtestable": true, "license": "DefiLlama: abierta, sin auth.", "auth_env": null, "features": ["hack_amount_usd", "hack_count"], "n_entities": 1, "connected": true, "notes": "Era 'el caso mas duro del catalogo' y la sonda dice otra cosa: 621 incidentes MEDIDOS desde 2016-06-17, la segunda muestra mas grande de las seis de evento. El importe llega en MILLONES de dolares y el adaptador lo pasa a dolares, para que no se compare un 1,5 de aqui con un 1,5 de otra serie. El evento no se anuncia, asi que aqui los dias-al-evento no miran adelante: lo que codifica es la ventana POSTERIOR. Revisable: DefiLlama corrige importes y clasificaciones despues del incidente.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": 519, "announced": false, "measured_from": "2016-06-17", "measured_to": "2026-08-09", "measured_days": 519, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 660}, {"key": "ofac_sdn", "title": "Lista OFAC SDN (direcciones sancionadas)", "tier": "A", "scope": "market", "cadence": "event", "entity_kind": "market", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "US Treasury: dominio publico.", "auth_env": null, "features": ["sdn_crypto_addresses", "sdn_new_entries"], "n_entities": 1, "connected": true, "notes": "Se publica la lista de HOY, no la de una fecha pasada. Reconstruir el pasado exige haber guardado cada version: forward_capture, y por eso el archivo es append-only con fetched_at. MEDIDO: 28 MB de XML, 19.199 registros y 977 direcciones de cripto (529 XBT, 198 TRX, 100 ETH...). Se archiva SOLO el subconjunto cripto —la unica excepcion del catalogo a 'el payload intacto', razonada en adapters/events.py— y el certificado del host no lo valida el almacen de Windows, asi que esta fuente usa el bundle de certifi.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": 1, "announced": false, "measured_from": "2026-08-07", "measured_to": "2026-08-07", "measured_days": 1, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 2}, {"key": "macro_calendar", "title": "Calendario macro (FOMC y publicaciones del IPC)", "tier": "A", "scope": "macro", "cadence": "event", "entity_kind": "market", "pit": "forward_capture", "history_from": "2017-02-01", "backtestable": true, "license": "Fuentes oficiales (Fed, BLS): dominio publico.", "auth_env": null, "features": ["fomc_meeting", "cpi_release"], "n_entities": 1, "connected": true, "notes": "Determinista y conocido con meses de antelacion: las fechas son exactas y no revisables, que es la mejor propiedad que puede tener una feature de evento. De una reunion de dos dias se toma el SEGUNDO, que es cuando sale el comunicado. DOS PROFUNDIDADES DISTINTAS, como en GitHub: el calendario de la Fed llega a 2017 (MEDIDO), pero el del BLS es una ventana RODANTE de ~13 meses, asi que la historia larga del IPC solo se acumula captura a captura y un cpi_release vacio en 2019 no significa que no hubiera IPC. El BLS no publica esto en JSON: se archiva el HTML crudo para poder re-derivar.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "", "snapshots": null, "pooled_events": 76, "announced": true, "measured_from": "2017-02-01", "measured_to": "2026-12-10", "measured_days": 76, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 86}, {"key": "hyperliquid_leverage", "title": "Distribucion del apalancamiento y concentracion del OI (Hyperliquid)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Hyperliquid: abierta, sin auth ni KYC.", "auth_env": null, "features": ["hl_leverage_median", "hl_leverage_p90", "hl_high_leverage_share", "hl_oi_top5_share", "hl_sampled_oi_usd"], "n_entities": 24, "connected": true, "notes": "LO QUE NINGUN CEX PERMITE: Binance publica el OI agregado; aqui el estado de cada cuenta es publico y la DISTRIBUCION se puede calcular. MEDIDO 2026-08-13: el leaderboard trae 41.714 cuentas y la muestra de las 200 mayores cubre el 21,7% del OI del venue (1.578 M$ de 7.285 M$). Es una MUESTRA SESGADA por construccion —las cuentas grandes— y esa es justo la mitad que decide un gap, pero la palabra 'distribucion' aqui significa 'distribucion en la cola de arriba' y no 'del libro entero'. Forward capture puro: nadie publica el estado de ayer, asi que cada dia sin capturar es profundidad perdida.", "encoding": "continua", "block": "activo", "typical_adv_usd": 307370.0, "adv_note": "MEDIDO 2026-08-13: mediana de `dayNtlVlm` sobre los 177 perps que NEGOCIAN (de 232 listados; los otros 55 no movieron nada en 24 horas). Decil inferior 93.597 $, maximo 1.748 M$. La media enganaria por tres ordenes de magnitud: la distribucion del apalancamiento existe en los 232, y el tamano solo cabe en la docena de arriba.", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2026-08-13", "measured_to": "2026-08-13", "measured_days": 5, "measured_entities": 5, "measure_method": "provider", "measure_error": null, "archived_records": 5}, {"key": "hyperliquid_liqmap", "title": "Mapa de precios de liquidacion (Hyperliquid)", "tier": "A", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Hyperliquid: abierta, sin auth ni KYC.", "auth_env": null, "features": ["liq_cluster_distance_pct", "liq_cluster_notional_usd"], "n_entities": 24, "connected": true, "notes": "LA TERCERA CODIFICACION DEL SISTEMA, y entra porque las otras dos no saben leer esto: un mapa de liquidacion no tiene fecha (no es un evento fechado) ni es un nivel comparable con su propia historia (una z de 'distancia al cluster' no responde a la pregunta). Lo que tiene es una DISTANCIA EN PRECIO y un notional, que es exactamente lo que codifica `events.py::PRICE_SPECS`. LIMITE MEDIDO 2026-08-13: solo el 75,7% de las posiciones muestreadas trae `liquidationPx`; en las de margen cruzado con holgura el campo llega nulo, asi que el mapa esta INCOMPLETO por abajo y el notional publicado es una cota inferior. No se estima el hueco: estimarlo exigiria replicar el motor de margen del venue.", "encoding": "mapa de precios", "block": "activo", "typical_adv_usd": 307370.0, "adv_note": "El mismo venue y la misma medicion que `hyperliquid_leverage`.", "snapshots": 5, "pooled_events": null, "announced": null, "measured_from": "2026-08-13", "measured_to": "2026-08-13", "measured_days": 5, "measured_entities": 5, "measure_method": "provider", "measure_error": null, "archived_records": 5}, {"key": "deribit_volatility", "title": "Superficie de volatilidad: DVOL, skew de 25 delta y term structure (Deribit)", "tier": "B", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2021-03-24", "backtestable": true, "license": "Deribit: API publica, sin auth.", "auth_env": null, "features": ["dvol_index", "skew_25d", "atm_iv_30d", "iv_term_slope"], "n_entities": 24, "connected": true, "notes": "DOS PROFUNDIDADES EN LA MISMA FUENTE, como en `macro_calendar`. El DVOL tiene backfill REAL y medido —2021-03-24 en BTC y en ETH, con paginacion hacia atras porque la API devuelve 1.000 puntos por peticion— y el skew y la pendiente salen del LIBRO DE HOY, que no tiene historia: esas dos son forward_capture dentro de una fuente declarada revisable, y el `history_from` de arriba solo respalda al DVOL. MEDIDO ademas: solo BTC y ETH tienen libro de opciones vivo (820 y 688 instrumentos); SOL tuvo DVOL entre 2022-05 y 2022-11 y dejo de publicarse, y XRP nunca lo tuvo. EL DELTA SE CALCULA AQUI: el libro no publica griegas, asi que el strike de 25 delta se busca con un Black-Scholes de tipo cero sobre `mark_iv` y se interpola en delta. Es una APROXIMACION declarada (las opciones de Deribit son inversas), y se hace en la capa pura para que sea testeable sin red.", "encoding": "continua", "block": "activo", "typical_adv_usd": 100937354.0, "adv_note": "MEDIDO 2026-08-13: mediana del volumen 24h en USD del perpetuo de las DOS monedas con libro de opciones (BTC 152,2 M$, ETH 49,7 M$). Aqui el ADV no es la restriccion —es la unica fuente del lote que vive en los dos activos mas profundos que existen— y por eso se declara: para que se vea que la restriccion esta en otras.", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": "2021-03-24", "measured_to": "2026-08-13", "measured_days": 3938, "measured_entities": 2, "measure_method": "provider", "measure_error": null, "archived_records": 3940}, {"key": "deribit_expiries", "title": "Calendario de vencimientos de opciones con OI por strike (Deribit)", "tier": "A", "scope": "asset", "cadence": "event", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Deribit: API publica, sin auth.", "auth_env": null, "features": ["expiry_oi_usd", "expiry_oi_share"], "n_entities": 24, "connected": true, "notes": "LA MEJOR PROPIEDAD QUE PUEDE TENER UNA FEATURE DE EVENTO: la fecha es fija y no la revisa nadie —el ultimo viernes del mes a las 08:00 UTC—, asi que los dias-al-evento son exactos y el calendario de hoy es el que estaba publicado hace un ano. MEDIDO 2026-08-13: 12 vencimientos vivos en BTC repartidos en 820 instrumentos; el trimestral de septiembre concentra 108.894 contratos y el semanal siguiente 19.888. Forward capture: el OI por strike es la foto de HOY y nadie publica la de una fecha pasada, asi que la profundidad de la MAGNITUD se compra capturando. Las FECHAS futuras, en cambio, ya estan.", "encoding": "evento", "block": "activo", "typical_adv_usd": 100937354.0, "adv_note": "El mismo venue y la misma medicion que `deribit_volatility`.", "snapshots": null, "pooled_events": 24, "announced": true, "measured_from": "2026-08-14", "measured_to": "2027-06-25", "measured_days": 24, "measured_entities": 2, "measure_method": "provider", "measure_error": null, "archived_records": 24}, {"key": "lending_health", "title": "Health factors y mapa de liquidacion del colateral (Aave / Compound)", "tier": "A", "scope": "asset", "cadence": "daily", "entity_kind": "token", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Subgrafos: la red descentralizada de The Graph exige clave (auth error medido).", "auth_env": "THEGRAPH_API_KEY", "features": ["lending_liq_distance_pct", "lending_liq_notional_usd"], "n_entities": 24, "connected": true, "notes": "EL OTRO LADO DEL APALANCAMIENTO: Hyperliquid dice donde revienta el apalancamiento del perpetuo y esto dice donde revienta el del colateral SPOT, que es el que fuerza ventas de verdad en el mercado al contado. Se codifica igual —mapa de precios— a proposito: son la misma clase de objeto. MEDIDO 2026-08-13, y el resultado es que hoy NO HAY VIA GRATUITA: api.thegraph.com ya no resuelve (el servicio alojado se retiro), el gateway descentralizado responde 'auth error: missing authorization header', la API de cuentas de Compound v2 devuelve 410 Gone y los datasets de liquidaciones de DefiLlama, 404. El adaptador se escribe igualmente por lo mismo que el de unlocks: para que eso sea una MEDICION fechada y no un hueco que se lea como 'nadie lo ha intentado'.", "encoding": "mapa de precios", "block": "activo", "typical_adv_usd": null, "adv_note": "Sin medicion: sin clave no hay respuesta y el eje de entidades no se puede resolver. Declararlo por analogia con Hyperliquid seria inventarlo.", "snapshots": 0, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": "La fuente 'lending_health' necesita THEGRAPH_API_KEY en el entorno (el gateway de The Graph responde 'auth error' sin cabecera)", "archived_records": 0}, {"key": "appstore_rank", "title": "Atencion retail por geografia: ranking en App Store (Corea frente a EE.UU.)", "tier": "B", "scope": "market", "cadence": "event", "entity_kind": "market", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Apple RSS (marketing tools): abierta, sin auth.", "auth_env": null, "features": ["app_visibility_kr", "app_visibility_us", "app_visibility_gap"], "n_entities": 1, "connected": true, "notes": "LA VERSION BUENA ES EL DIFERENCIAL, no el ranking de Coinbase en EE.UU.: la señal es que Corea se caliente ANTES, y el nivel absoluto de cada lista lo domina lo que no tiene nada que ver con cripto. DOS LIMITES MEDIDOS 2026-08-13 que cambian el diseno: (1) la lista es de CIEN puestos y no mas —pedir 200 devuelve 500— y el parametro de genero se IGNORA, asi que la unica lista disponible es la general; (2) ese dia NINGUNA de las cuatro apps (Upbit, Coinbase, Binance, Bitget) estaba en el top 100 de Corea ni en el de EE.UU. Una serie continua de ceros no la puede normalizar `normalize.py` —mediana 0, IQR 0, z indefinida— asi que la fuente se declara de EVENTO: el evento es 'una app cripto entra en la lista general', que es exactamente el hecho que interesa, y los dias en que no entra ninguna no producen fila.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: el eje no es un activo, asi que el ADV que limita es el del universo que se opere y no uno de la fuente.", "snapshots": null, "pooled_events": 0, "announced": false, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "provider", "measure_error": null, "archived_records": 2}, {"key": "naver_datalab", "title": "Interes de busqueda en Corea (Naver DataLab)", "tier": "B", "scope": "market", "cadence": "daily", "entity_kind": "market", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "Naver Developers: gratuito, exige client id y secret (401 medido).", "auth_env": "NAVER_CLIENT_ID", "features": ["naver_search_index"], "n_entities": 1, "connected": true, "notes": "Naver es el buscador de Corea y Corea pesa de forma desproporcionada en las altcoins; el dato es gratuito y practicamente nadie lo mira fuera del pais. MEDIDO 2026-08-13: 401 sin credencial. Hacen falta DOS variables (NAVER_CLIENT_ID y NAVER_CLIENT_SECRET) y el catalogo solo declara el nombre de una porque el campo es uno; el adaptador lee las dos y lo dice si falta cualquiera. La API devuelve un indice RELATIVO a la ventana pedida: dos ventanas distintas no son comparables entre si, y por eso se pide siempre la misma longitud de ventana y la fuente se declara revisable.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: igual que `appstore_rank`.", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": "La fuente 'naver_datalab' necesita NAVER_CLIENT_ID y NAVER_CLIENT_SECRET en el entorno (401 medido sin las dos)", "archived_records": 0}, {"key": "yandex_wordstat", "title": "Interes de busqueda en Rusia (Yandex Wordstat)", "tier": "B", "scope": "market", "cadence": "monthly", "entity_kind": "market", "pit": "forward_capture", "history_from": null, "backtestable": false, "license": "Yandex Direct API: gratuito con cuenta de anunciante, exige token OAuth.", "auth_env": "YANDEX_OAUTH_TOKEN", "features": ["yandex_search_shows"], "n_entities": 1, "connected": true, "notes": "MEDIDO 2026-08-13: sin token la API contesta con error propio (codigo 501) en vez de 401, que es su forma de decir que no hay sesion. Wordstat es MENSUAL —no publica serie diaria— y ademas es una foto: el informe se genera contra el momento en que se pide, asi que su pasado no se descarga. Es la fuente menos util de las tres de atencion y esta aqui porque el hueco geografico que cubre no lo cubre ninguna otra.", "encoding": "continua", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: igual que `appstore_rank`.", "snapshots": null, "pooled_events": null, "announced": null, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "archive", "measure_error": "La fuente 'yandex_wordstat' necesita YANDEX_OAUTH_TOKEN en el entorno", "archived_records": 0}, {"key": "sec_edgar_fts", "title": "Menciones en filings de la SEC (EDGAR full-text search)", "tier": "A", "scope": "market", "cadence": "event", "entity_kind": "market", "pit": "archive_revisable", "history_from": "2025-06-20", "backtestable": true, "license": "SEC: dominio publico. Exige User-Agent identificable.", "auth_env": null, "features": ["edgar_filings", "edgar_institutional"], "n_entities": 1, "connected": true, "notes": "LLEGA ANTES QUE LA NOTICIA porque ES la noticia: un 8-K esta publicado en EDGAR horas antes de que nadie lo escriba. MEDIDO 2026-08-13: la API responde sin credencial, cubre desde 2001 (consultas de 2001, 2005, 2011 y 2014 devuelven resultados) y hay 5.784 filings 13F-HR que mencionan bitcoin en lo que va de 2026. DOS LIMITES MEDIDOS: la respuesta trae como mucho ~100 hits y el total se corta en 10.000, asi que el recuento DIARIO se pide un dia por peticion; y por eso el adaptador declara un tope de dias por pasada (EDGAR_MAX_DAYS) en vez de fingir que un backfill de doce anos cabe en una llamada. Revisable: un filing se puede enmendar y reindexar. Y por eso el history_from de arriba es 2025-06-20 y no 2001: es lo que UNA pasada ha medido, no lo que el proveedor tiene. Cada pasada nueva lo empuja hacia atras otros catorce meses, y el registro de profundidad lo ira diciendo.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: igual que `appstore_rank`.", "snapshots": null, "pooled_events": 420, "announced": false, "measured_from": "2025-06-20", "measured_to": "2026-08-13", "measured_days": 420, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 420}, {"key": "federal_register", "title": "Actividad regulatoria fechada (Federal Register API)", "tier": "A", "scope": "macro", "cadence": "event", "entity_kind": "market", "pit": "archive_revisable", "history_from": "2015-11-02", "backtestable": true, "license": "Federal Register: dominio publico, sin auth.", "auth_env": null, "features": ["fedreg_documents", "fedreg_rules"], "n_entities": 1, "connected": true, "notes": "La fuente mas comoda de las tres legales: acepta rangos de fecha, devuelve hasta 1.000 documentos por peticion y no pide credencial. DOS MEDICIONES 2026-08-13 que conviene no confundir: una consulta suelta sin limite de fecha encuentra 398 documentos con 'digital asset' desde 2010-01-11 (y el archivo entero del Federal Register llega a 1994), pero la SONDA, que pide los doce anos que declara PROBE_YEARS, encontro el primero en 2015-11-02. El catalogo declara lo segundo: lo que el adaptador REAL trajo, no lo que el proveedor tiene. Se fecha por `publication_date` —el dia en que el EXISTE— y no por `effective_on`, que suele ser posterior y a veces nulo. Las fechas futuras que el propio documento trae (fin del plazo de comentarios, entrada en vigor) quedan en el payload crudo para el dia que se quieran usar: hoy no se anticipan, asi que la codificacion no mira adelante.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: igual que `appstore_rank`.", "snapshots": null, "pooled_events": 303, "announced": false, "measured_from": "2015-11-02", "measured_to": "2026-08-13", "measured_days": 303, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 397}, {"key": "courtlistener_dockets", "title": "Litigios y dockets federales (CourtListener / RECAP)", "tier": "A", "scope": "market", "cadence": "event", "entity_kind": "market", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "Free Law Project: API publica; v4 responde sin token (v3 da 403).", "auth_env": null, "features": ["court_dockets"], "n_entities": 1, "connected": true, "notes": "MEDIDO 2026-08-13: la version 4 de la API contesta SIN token (9.569 dockets con 'cryptocurrency') y la version 3 devuelve 403, que es al reves de lo que documenta media internet. Pagina de veinte en veinte, asi que el adaptador declara un tope de paginas por pasada: lo que hay dentro de la ventana cubierta es exacto y lo que queda fuera se declara, en vez de publicar un recuento truncado como si fuera completo.", "encoding": "evento", "block": "mercado", "typical_adv_usd": null, "adv_note": "Alcance de mercado: igual que `appstore_rank`.", "snapshots": null, "pooled_events": 104, "announced": false, "measured_from": "2026-04-09", "measured_to": "2026-08-12", "measured_days": 92, "measured_entities": 1, "measure_method": "provider", "measure_error": null, "archived_records": 400}, {"key": "cex_listings", "title": "Listados y deslistados de CEX (Upbit)", "tier": "A", "scope": "asset", "cadence": "event", "entity_kind": "token", "pit": "archive_revisable", "history_from": "2018-08-02", "backtestable": true, "license": "Upbit: endpoint publico de anuncios, sin auth.", "auth_env": null, "features": ["listing_change", "listing_warning"], "n_entities": 24, "connected": true, "notes": "EL EVENTO MAS LIMPIO DE CRIPTO, y ademas el unico del lote que pide una guarda OPERATIVA y no solo una feature: un deslistado es oferta forzada mas riesgo de liquidez, y eso no se arregla con una feature (ver la evolucion 'Guarda operativa por simbolo', que sigue pendiente a proposito). MEDIDO 2026-08-13: el endpoint tiene 38 paginas de categoria 'trade' que llegan a 2017-10-27, y la sonda bajo 33 de ellas —523 eventos fechados sobre 343 tokens desde 2018-08-02— antes de topar con el limite de tasa; el catalogo declara ESO y no el fondo del archivo. Los tres tipos que importan estan: alta, baja y designacion de vigilancia previa a la baja. SE FECHA EL ANUNCIO, no la ejecucion, por lo mismo que el COT se fecha el dia de publicacion: el anuncio es cuando la informacion existe. Y por eso `announced=False`: un listado no se preanuncia, asi que mirar hacia adelante aqui seria futuro. LIMITE DECLARADO: el endpoint de listado solo da el TITULO, y la fecha de ejecucion de una baja vive en el cuerpo del anuncio; leerla exigiria una peticion por anuncio.", "encoding": "evento", "block": "activo", "typical_adv_usd": 247645.0, "adv_note": "MEDIDO 2026-08-13: mediana del volumen 24h de los 283 mercados KRW, con el cambio KRW/USD sacado del propio venue (p10 = 39.450 $, maximo = 99,0 M$). El 'efecto Upbit' es real y vive en activos cuya mediana mueve un cuarto de millon al dia: el evento es limpio y el tamano que admite, no.", "snapshots": null, "pooled_events": 522, "announced": false, "measured_from": "2018-08-02", "measured_to": "2026-08-12", "measured_days": 522, "measured_entities": 343, "measure_method": "provider", "measure_error": null, "archived_records": 523}, {"key": "dat_mnav", "title": "Estres de vendedores forzados: distribucion del mNAV de las tesorerias cotizadas", "tier": "A", "scope": "asset", "cadence": "event", "entity_kind": "token", "pit": "archive_revisable", "history_from": null, "backtestable": false, "license": "SEC: dominio publico, exige User-Agent identificable. Precios: endpoint publico.", "auth_env": null, "features": ["dat_below_nav_share", "dat_mnav_gap", "dat_mnav_p25", "dat_companies", "dat_disclosure_lag_days"], "n_entities": 24, "connected": true, "notes": "LO QUE PUBLICA NO ES EL mNAV DE NADIE: es la DISTRIBUCION por activo subyacente. Por debajo de 1 la maquina va en reversa y es aritmetica, no sentimiento —emitir diluye, asi que la via barata para levantar caja es vender el tesoro— y cada companıa en esa cola es oferta futura estructural. TRES FILTROS Y NINGUNO MIRA EL mNAV, porque definir la cohorte con el propio mNAV truncaria justo la cola que se publica: fuera los SIC 6221 (ETF y trusts al contado, que cotizan al NAV por arbitraje) y 6211 (brokers que custodian cripto ajena); dentro solo si el tesoro pasa del 50% del ACTIVO TOTAL del balance; y solo si se sabe que activo es. EL RESULTADO DE COMPONERLA, MEDIDO 2026-08-13, Y NO ES EL QUE SE ESPERABA: de 138 declarantes de cripto en el registro XBRL quedan TRES companias publicables, repartidas en tres activos distintos, asi que HOY NO HAY NINGUNA DISTRIBUCION QUE PUBLICAR y la fuente produce cero filas. El desglose es la medicion: 25 trusts y 3 brokers fuera por SIC, 61 que declaran el valor razonable en dolares y NO el numero de unidades (sin unidades no se puede marcar a mercado ni identificar el activo), 26 cuyo tesoro no llega al 50% del balance —mineras, sobre todo—, 6 multiclase, 12 que no nombran su activo y 4 cuyo activo no se opera. LA IDENTIFICACION ES LO QUE MAS CUESTA, y la primera version estaba mal: identificar por el PRECIO IMPLICITO (valor razonable / unidades) y quedarse con el unico activo del universo que cuadrase daba DOS falsos positivos de ocho (TON Strategy Co salia NEAR, Hyperion DeFi salia LTC), porque 'el unico que cuadra' solo significa algo con el conjunto de candidatos completo y hay miles de tokens. Hoy IDENTIFICA UN NOMBRE —la etiqueta de unidad o la razon social— y el precio implicito solo VERIFICA, que es lo que atrapa a CleanSpark declarando 1.719.000 unidades `Bitcoin` a 58,53 $ (error de escala de mil en el propio filing) y a Bit Digital con un valor razonable que cubre toda su cartera. Se paga en cobertura y esta contado. HUECO DECLARADO, y es el mayor: las APIs XBRL solo exponen hechos SIN DIMENSIONES, asi que una companıa con varias clases de accion no publica recuento de ordinarias y LA TESORERIA MAS GRANDE QUE EXISTE queda fuera (COMPROBADO: el `companyfacts` de Strategy tiene un solo tag `dei`, EntityPublicFloat). No se sustituye por la media ponderada del periodo, que si esta: es una MEDIA, y estas companias emiten contra el mercado todos los dias, asi que sesgaria a la baja la capitalizacion justo de las mas activas y las empujaria hacia la cola inferior. history_from sigue a None porque no hay ninguna fila que fechar, y eso es la medicion y no un pendiente.", "encoding": "evento", "block": "activo", "typical_adv_usd": null, "adv_note": "El eje es el activo subyacente y son los mas profundos que existen, asi que aqui el ADV no restringe. Lo que restringe es el otro lado del cociente —la accion— y ese venue no lo mide `signals/liquidity.py`, cuyas tres sondas son de cripto: declararlo por analogia seria inventarlo.", "snapshots": null, "pooled_events": 0, "announced": false, "measured_from": null, "measured_to": null, "measured_days": 0, "measured_entities": 0, "measure_method": "provider", "measure_error": null, "archived_records": 74362}], "entities": {"n_symbols": 24, "coverage_pct": 100.0, "by_source": {"rule": 24, "override": 0, "unmapped": 0}, "by_kind": {"token": 24}, "unmapped": [], "collisions": {}, "n_entities": 24}, "arc dad de dato, fuente por fuente", "line": "Datos", "status": "pendiente", "impact": "alto", "effort": "medio", "evidence": "Las 30 fuentes se agregan hoy en seis features (tono, intensidad y cobertura, por activo y de mercado) y NUNCA se han mirado de una en una. Hay precedentes de que bajar al dato cambia la respuesta: identificar el activo de una tesorería por su precio implícito daba 25% de falsos positivos, y el efecto Upbit resultó vivir en mercados de 248k $/día. Las dos cosas se vieron mirando la fuente, no el agregado.", "why": "El radar promedia. Un promedio de una fuente rota y cuatro sanas parece sano, y esa es exactamente la forma en que un dato malo entra en una decisión sin que nadie lo vea. Antes de generar estrategias sobre estas señales hay que saber cuáles valen: qué latencia real tiene cada una, cuántos huecos, si su fecha es de publicación o de referencia, y si su distribución cambia de régimen a mitad de la serie.", "prompt": "Proyecto ai-trader (Python). Las 30 fuentes de signals/catalog.py se normalizan (signals/normalize.py) y se agregan en seis features del radar (observation/signal_radar.py). Nadie las ha mirado NUNCA de una en una.\n\nTAREA: un informe de calidad POR FUENTE, publicado en data/signals/, que conteste para cada una y con cifras:\n(a) COBERTURA: dias con dato / dias del rango, y el hueco mas largo. Un hueco de tres semanas en una serie diaria no es 'ruido', es que la fuente estuvo caida.\n(b) LATENCIA REAL: distancia entre la fecha de referencia del dato y la fecha en que se pudo observar. Ojo con las que se fechan por PUBLICACION (el COT ya lo hace): usar la fecha de referencia en un backtest es mirar el futuro.\n(c) ESTABILIDAD: media, dispersion y fraccion de ceros por ano. Una serie cuya distribucion cambia a mitad del historico esta midiendo dos cosas distintas con el mismo nombre.\n(d) REDUNDANCIA: correlacion entre fuentes del mismo tema. Cinco fuentes que dicen lo mismo son una fuente con cinco votos, y el radar las cuenta como cinco.\n(e) UN VEREDICTO POR FUENTE que pueda ser NEGATIVO: apta / apta con reservas / no apta para decidir, con el motivo. Un informe que no puede suspender a nadie no es un control de calidad.\n\nY engancharlo: las fuentes 'no aptas' tienen que quedar fuera del radar por CONFIGURACION, no porque alguien se acuerde. Declara cuantas quedan fuera y cuanto cambia la cobertura de cada tema al quitarlas.\n\nTests + determinismo + .venv\\Scripts\\python.exe + ruff. Regenera dashboard y docs.\n\n--- ANTES DE ESCRIBIR CODIGO NUEVO (regla fija de este repo) ---\n\nDeclara estas tres cosas POR ESCRITO, en tu respuesta, antes de tocar el primer fichero:\n\n  1. DONDE VA. Modulo y funcion exactos, y por que ahi y no en otro sitio.\n\n  2. QUE YA EXISTE QUE SE LE PARECE. Busca ANTES de escribir, no despues:\n       grep -rn \"<el concepto>\" src/          y tambien por los nombres que ibas a usar\n     Mira siempre estos cuatro, que es donde vive lo reutilizable:\n       src/ai_trader/shared/        barras, indicadores, reloj, instrumentos, senales\n       src/ai_trader/backtest/metrics.py     metricas de resultado\n       src/ai_trader/research/research/synthetic/fidelity.py   stylized facts, autocorrelacion, colas\n       src/ai_trader/scoring/aggregate.py    la recompensa (CVaR)\n     Di que encontraste, aunque no encaje. \"No busque\" no es una respuesta valida.\n\n  3. POR QUE NO LO REUTILIZAS. Si no reutilizas lo que encontraste, da el motivo.\n     \"Es parecido pero no igual\" NO es un motivo: di QUE difiere exactamente y por que\n     parametrizar lo que ya existe seria peor que tener dos copias.\n\nSi acabas con un cuerpo identico a otro que ya existe, la salida por defecto es extraerlo\na una funcion comun y dejar los nombres antiguos como ALIAS QUE DELEGAN, para no romper\nninguna llamada. Mueve el cuerpo TAL CUAL, sin reescribirlo: si tocas calculo, el orden de\nlas operaciones en coma flotante tiene que ser el mismo, y los golden de tests/golden/ son\nla esultado\n       src/ai_trader/research/research/synthetic/fidelity.py   stylized facts, autocorrelacion, colas\n       src/ai_trader/scoring/aggregate.py    la recompensa (CVaR)\n     Di que encontraste, aunque no encaje. \"No busque\" no es una respuesta valida.\n\n  3. POR QUE NO LO REUTILIZAS. Si no reutilizas lo que encontraste, da el motivo.\n     \"Es parecido pero no igual\" NO es un motivo: di QUE difiere exactamente y por que\n     parametrizar lo que ya existe seria peor que tener dos copias.\n\nSi acabas con un cuerpo identico a otro que ya existe, la salida por defecto es extraerlo\na una funcion comun y dejar los nombres antiguos como ALIAS QUE DELEGAN, para no romper\nninguna llamada. Mueve el cuerpo TAL CUAL, sin reescribirlo: si tocas calculo, el orden de\nlas operaciones en coma flotante tiene que ser el mismo, y los golden de tests/golden/ son\nla prueba de que lo fue.\n\nPOR QUE ESTA REGLA: la auditoria del 2026-08-12 (ver DEBT_AUDIT.md y DEBT_BACKLOG.md)\nencontro 21 grupos de funciones con el cuerpo IDENTICO, ~135 lineas. Los peores no eran\nutilidades sino calculo publicado: el CVaR que DEFINE LA RECOMPENSA esta escrito tres\nveces (scoring/aggregate.py:103, research/activity_study.py:104,\nresearch/transfer_study.py:654) y el cargador de informes, seis. Ninguna de esas copias la\ndetecta un test, porque cada una tiene los suyos: corregir una y no las otras deja al\nsistema puntuando con dos definiciones distintas de la misma metrica."}, {"id": "paper-trading-live", "rank": 4, "group": "ahora", "priority": "alta", "title": "Mantener el proceso vivo hasta que el diario tenga un mes", "line": "Live", "status": "pendiente", "impact": "alto", "effort": "bajo", "evidence": "La MEDICIÓN ya está hecha y probada, no solo la infraestructura: backtest/divergence_study.py re-simula la ventana del diario con el mismo motor (enganchándole un MemoryJournal, así que emite el mismo esquema de línea), parea por (día, símbolo, estrategia), reparte la diferencia de precio en tres sumandos que SUMAN -referencia, coste y cruzado-, compara el embudo de decisiones y tasa la latencia contra barras 1H reales. Publica en data/live/divergence.json con tres reglas que pueden fallar. Y el diario sella ahora los dos instantes que hacen medible la latencia (decided_at en la orden y en la salida). Lo único que falta es CALENDARIO: con menos de 30 días el estudio se niega a re-simular y dice cuántos faltan.", "why": "Sigue siendo el número 1 porque es lo único que no se puede comprimir después, pero el trabajo cambió de naturaleza: ya no hay nada que construir, hay que DEJAR CORRER. Cada semana que el proceso no despierta es una semana perdida al final, y ahora el coste de no hacerlo es visible -la vista de paper trading dice cuántos días faltan, medidos-. Cuando el diario pase de 30 días, esta entrada se cierra corriendo un comando.", "prompt": "Proyecto ai-trader (Python). NO HAY NADA QUE PROGRAMAR EN ESTA ENTRADA: la medicion de divergencia live-vs-backtest ya esta escrita, probada y publicada en src/ai_trader/backtest/divergence_study.py -> data/live/divergence.json, conectada a la vista 'Paper trading' y a la seccion 5.4 de la documentacion.\n\nLo que falta es CALENDARIO. El estudio exige 30 dias de diario (span de calendario Y dias con ciclos) y, por debajo de eso, se niega a re-simular y publica el estado 'sin_potencia' diciendo cuantos dias faltan.\n\nQUE HACER, en este orden:\n(1) Comprobar que el proceso en vivo sigue despertando: data/live/cycles.jsonl tiene que crecer. Si lleva dias parado, arrancarlo (seccion 'Operacion continua' del README) es TODO el trabajo de esta entrada.\n(2) Correr el estudio y mirar que dice:\n    .venv\\Scripts\\python.exe -m ai_trader.backtest.divergence_study --offline\n(3) Si ya hay potencia y publica cifra, LEERLA en este orden y no en otro: primero la cobertura de decisiones (si los dos mundos no ven las mismas senales, cualquier cifra de coste esta explicando la diferencia equivocada), despues el reparto del precio de llenado, y solo entonces la latencia.\n(4) Regenerar dashboard y docs, y actualizar esta entrada con el resultado -incluido si alguna de las tres reglas FALLA, que es un resultado y no un fallo del estudio-.\n\nSi al leer la cifra decides cambiar el motor (por ejemplo, modelar la latencia), eso es OTRA entrada: este estudio mide y declara, no toca execution/.\n\n--- ANTES DE ESCRIBIR CODIGO NUEVO (regla fija de este repo) ---\n\nDeclara estas tres cosas POR ESCRITO, en tu respuesta, antes de tocar el primer fichero:\n\n  1. DONDE VA. Modulo y funcion exactos, y por que ahi y no en otro sitio.\n\n  2. QUE YA EXISTE QUE SE LE PARECE. Busca ANTES de escribir, no despues:\n       grep -rn \"<el concepto>\" src/          y tambien por los nombres que ibas a usar\n     Mira siempre estos cuatro, que es donde vive lo reutilizable:\n       src/ai_trader/shared/        barras, indicadores, reloj, instrumentos, senales\n       src/ai_trader/backtest/metrics.py     metricas de resultado\n       src/ai_trader/research/research/synthetic/fidelity.py   stylized facts, autocorrelacion, colas\n       src/ai_trader/scoring/aggregate.py    la recompensa (CVaR)\n     Di que encontraste, aunque no encaje. \"No busque\" no es una respuesta valida.\n\n  3. POR QUE NO LO REUTILIZAS. Si no reutilizas lo que encontraste, da el motivo.\n     \"Es parecido pero no igual\" NO es un motivo: di QUE difiere exactamente y por que\n     parametrizar lo que ya existe seria peor que tener dos copias.\n\nSi acabas con un cuerpo identico a otro que ya existe, la salida por defecto es extraerlo\na una funcion comun y dejar los nombres antiguos como ALIAS QUE DELEGAN, para no romper\nninguna llamada. Mueve el cuerpo TAL CUAL, sin reescribirlo: si tocas calculo, el orden de\nlas operaciones en coma flotante tiene que ser el mismo, y los golden de tests/golden/ son\nla prueba de que lo fue.\n\nPOR QUE ESTA REGLA: la auditoria del 2026-08-12 (ver DEBT_AUDIT.md y DEBT_BACKLOG.md)\n
