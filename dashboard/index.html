<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Trader Dashboard</title><style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4; --s4:#eda100; --s5:#1baf7a;
  --s6:#eb6834; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s3:#d55181; --s4:#c98500; --s5:#199e70; --s6:#d95926; --s7:#9085e9; --s8:#e66767;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
a{color:var(--s1)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:700;font-size:16px;margin:0 0 2px}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.nav{list-style:none;padding:0;margin:18px 0 0}
.nav li{margin:2px 0}
.nav button{width:100%;text-align:left;background:none;border:0;color:var(--ink2);
  padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.nav button:hover{background:var(--plane)}
.nav button.active{background:var(--s1);color:#fff;font-weight:600}
.main{padding:26px 32px;max-width:1180px;overflow-x:hidden}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:30px 0 12px}
h3{font-size:15px;margin:0 0 8px}
.lead{color:var(--ink2);margin:0 0 18px;max-width:78ch}
.section{display:none}
.section.active{display:block}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.tile .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:26px;font-weight:700;margin-top:4px}
.tile .s{color:var(--ink2);font-size:12px;margin-top:2px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.chip.tendencia{background:color-mix(in srgb,var(--s1) 18%,transparent);color:var(--s1)}
.chip.reversion{background:color-mix(in srgb,var(--s7) 22%,transparent);color:var(--s7)}
.chip.mixto{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
.chip.alto{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.chip.medio{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.bajo{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
.chip.pendiente{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.hecho{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.chip.pend{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.chip.placeholder{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
.mbar{height:9px;border-radius:4px;background:var(--s1);display:inline-block;vertical-align:middle}
.mbar.v1{background:var(--muted)}
.mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px}
.btn{background:var(--s1);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13px;font-weight:600}
.btn.ghost{background:none;color:var(--ink2);border:1px solid var(--border)}
.btn:hover{filter:brightness(1.06)}
.toggle{position:absolute;top:20px;right:20px}
.tag{color:var(--muted);font-size:12px}
.note{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
  border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink2);margin:8px 0 16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
.prompt{background:var(--plane);border:1px solid var(--border);border-radius:8px;padding:11px;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;white-space:pre-wrap;color:var(--ink2);max-height:150px;overflow:auto;margin:10px 0}
.rowbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scenlist{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto;padding-right:6px}
.scenitem{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px;cursor:pointer}
.scenitem:hover{border-color:var(--s1)}
.scenitem.active{border-color:var(--s1);box-shadow:0 0 0 1px var(--s1) inset}
.scenitem .t{font-weight:600}
.split{display:grid;grid-template-columns:280px 1fr;gap:18px;align-items:start}
.chart-tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  border-radius:7px;padding:6px 9px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:9;display:none}
svg{max-width:100%;display:block}
.pill{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px;margin-right:4px}
/* --- evoluciones: lista ordenada por criticidad --- */
.rmgroup{margin:30px 0 0;padding-top:16px;border-top:1px solid var(--border)}
.rmgroup:first-of-type{border-top:0;padding-top:0;margin-top:18px}
.rmgroup h2{margin:0 0 2px}
.rmgroup .sub{color:var(--ink2);font-size:13px;margin:0 0 14px;max-width:82ch}
.rmlist{display:flex;flex-direction:column;gap:12px}
.rmitem{--pc:var(--muted);display:grid;grid-template-columns:52px 1fr;gap:14px;
  background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--pc);
  border-radius:12px;padding:14px 16px}
.rmitem.critica{--pc:var(--crit)}
.rmitem.alta{--pc:var(--serious)}
.rmitem.media{--pc:var(--warn)}
.rmitem.baja{--pc:var(--s1)}
.rmitem.aparcada{--pc:var(--muted)}
.rmrank{text-align:center;line-height:1.05;padding-top:2px}
.rmrank b{font-size:24px;font-weight:700;color:var(--pc);font-variant-numeric:tabular-nums}
.rmrank small{display:block;margin-top:3px;font-size:10px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em}
.rmhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.rmhead h3{margin:0;font-size:15.5px}
.rmev{border-left:3px solid var(--pc);padding:3px 0 3px 11px;margin:9px 0;color:var(--ink2);font-size:12.5px}
.rmwhy{color:var(--ink2);margin:4px 0 0;max-width:82ch}
details.pr{margin:10px 0 0}
details.pr summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--s1);list-style:none;padding:3px 0}
details.pr summary::-webkit-details-marker{display:none}
details.pr summary:before{content:'▸ '}
details.pr[open] summary:before{content:'▾ '}
details.pr .prompt{max-height:340px}
.chip.critica{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.chip.alta{background:color-mix(in srgb,var(--serious) 30%,transparent);color:var(--serious)}
.chip.media{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--serious)}
.chip.baja{background:color-mix(in srgb,var(--s1) 16%,transparent);color:var(--s1)}
.chip.bloqueada{background:color-mix(in srgb,var(--s7) 20%,transparent);color:var(--s7)}
.chip.aparcada{background:color-mix(in srgb,var(--muted) 22%,transparent);color:var(--ink2)}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.split{grid-template-columns:1fr}
  .rmitem{grid-template-columns:1fr}.rmrank{text-align:left;display:flex;gap:8px;align-items:baseline}
  .rmrank small{margin:0}}

 ["la ventana mediana tiene 1.00 operaciones (< 3)", "49.2% de ventanas vacias (> 25%)"], "mean_reversion#07": ["la ventana mediana tiene 0.00 operaciones (< 3)", "67.5% de ventanas vacias (> 25%)"]}}}}, "verdict": {"key": "sin_transferencia", "rho": -0.0382, "threshold": 0.3, "decision": "|rho| = 0.038 < 0.30", "flow": "no se disenan estrategias contra el sintetico: el ranking lo fija el historico real y el sintetico se queda como banco de estres, nunca como criterio de seleccion", "ci_excludes_zero": false, "transfers": false}, "caveats": [{"key": "inactividad_premiada", "title": "El CVaR premia no operar, y por eso el ranking tiene un suelo", "text": "Una configuracion que apenas abre posiciones deja la curva plana: Sharpe 0, rotacion 0, caida 0, headline 0 EXACTO. En un periodo en el que casi todo lo que arriesga pierde, ese cero gana. La correlacion entre recompensa y operaciones por ventana lo mide: -0.8447 en el real y -0.0868 en el sintetico. La respuesta NO es penalizar la baja rotacion (eso ya lo hace lambda, y el estudio de pesos midio que no estabiliza nada) sino un REQUISITO DE ELEGIBILIDAD: para entrar en el ranking hay que operar al menos 3 veces en la ventana mediana y tener como mucho un 25% de ventanas vacias (ver scoring.activity). En el lado real eso deja 9 de 16 configuraciones, cambia al ganador de mean_reversion#07 a crypto_momentum#00 y reduce los aprobados del gate de 7 a 1. Las que caen conservan su recompensa publicada: no se les resta nada, se les niega competir. El rho restringido a las 9 configuraciones que operan de verdad en los dos mundos es -0.6667. Al quitar la inactividad el acuerdo no aparece: se vuelve NEGATIVO. Entre configuraciones que actuan de verdad, el sintetico tiende a invertir el orden del mercado, asi que el veredicto de arriba no es un artefacto de las inactivas —es, si acaso, mas benigno que la realidad. Es un subconjunto POST-HOC y pequeno, y su intervalo por bloques [-0.8833, 0.2333] cruza el cero: senal fuerte, no prueba."}, {"key": "un_solo_camino", "title": "El lado real es UN camino, no un ensemble", "text": "El sintetico son 8 mundos distintos; el real son 5 tramos del MISMO pasado. Ese lado no tiene ensemble y su unica fuente de dispersion son los folds del CPCV, que ademas reusan calendario. Por eso el intervalo es un bootstrap por bloques y no iid: con 5 bloques reales sale ancho, y esa anchura es la verdad disponible, no un defecto del metodo."}, {"key": "sesgo_supervivencia", "title": "Sesgo de supervivencia en el lado real", "text": "Los simbolos son los que cotizan HOY en el universo operable: los pares deslistados o muertos entre 2018 y 2025 no estan en ninguna parte, y el generador sintetico no tiene ese filtro. El sesgo juega A FAVOR del lado real (su historia esta seleccionada por haber sobrevivido) y por tanto EN CONTRA de la hipotesis que este estudio quiere validar: introduce una diferencia sistematica entre los dos mundos que solo puede bajar el rho."}, {"key": "historico_insuficiente", "title": "Simbolos omitidos por historico insuficiente", "text": "13 pares del universo operable quedan fuera y 11 entran. El criterio no es a ojo: hacen falta 270 dias de barras dentro de la ventana (calentamiento de la estrategia mas un grupo de CPCV), porque por debajo de eso el par no llega a operarse ni en una sola ventana OOS. Los omitidos se DECLARAN con su recuento y sus fechas; no se rellenan ni se sustituyen, porque un par listado hace unos meses no tiene 2018 y fabricarselo seria inventar el dato que se quiere medir."}, {"key": "cobertura_creciente", "title": "El universo real crece con el tiempo; el sintetico no", "text": "Varios de los pares que si entran empiezan a cotizar a mitad de la ventana, asi que las sub-ventanas antiguas se operan con menos activos que las recientes. En el mundo sintetico los 11 activos existen desde el primer dia. Es una diferencia estructural entre los dos lados que no se puede eliminar sin tirar la mitad del historico."}, {"key": "rejilla_pequena", "title": "16 configuraciones, y de solo dos familias", "text": "Una correlacion de rangos sobre 16 puntos tiene un error de muestreo grande: sirve para distinguir 'ordena como el mercado' de 'no ordena', no para comparar 0,35 con 0,45. Ademas la rejilla es un hipercubo latino sobre el espacio de busqueda, no la distribucion que el CEM visita de verdad al converger; la transferencia medida es la del espacio, no la de la region final del optimizador."}, {"key": "folds_dependientes", "title": "Los folds de CPCV no son independientes", "text": "C(6, 2) = 15 ventanas salen de reusar los mismos tramos de calendario en combinaciones distintas. Cuentan como evidencia sobre la estabilidad del resultado, no como observaciones independientes; el bootstrap por bloques es justo lo que impide tratarlas como tales."}, {"key": "cabecera_descartada", "title": "La cabecera del historico se descarta", "text": "324 dias iniciales no completan una sub-ventana del tamano de un camino sintetico y quedan fuera. El corte se hace por el principio a proposito (es el tramo con menos pares vivos), y se declara porque cambia que anos entran en la comparacion."}], "baselines": {"real": {"btc_hold": -1.4221, "equal_weight": -1.3904}, "synthetic": {"btc_hold": -1.008, "equal_weight": -1.0564}, "missing": ["spy_hold"]}, "leakage": {"folds_audited": 3120, "clean": true}, "generated_at": "2026-08-11"}, "strategies": {"observation": {"own_asset": [{"name": "ret_1d", "desc": "Retorno log a 1 dia"}, {"name": "ret_5d", "desc": "Retorno log a 5 dias"}, {"name": "ret_20d", "desc": "Retorno log a 20 dias"}, {"name": "ret_60d", "desc": "Retorno log a 60 dias"}, {"name": "sma_ratio", "desc": "Ratio SMA rapida/lenta (tendencia)"}, {"name": "price_sma_z", "desc": "Distancia precio-SMA en z-score"}, {"name": "rsi", "desc": "RSI 14 (momentum)"}, {"name": "macd_norm", "desc": "Histograma MACD normalizado"}, {"name": "atr_pct", "desc": "ATR como % del precio (volatilidad)"}, {"name": "realized_vol_2 se sostiene: la cuota estadounidense de varianza sube 7.64% de media entre el antes y el despues de 2024-01-01, en 10 de 10 pares (test de signos p = 0.002). Su MECANISMO, en cambio, NO: la cuota ya venia subiendo antes del corte (Spearman ano-cuota = +0.80 sobre 2020-2023, por encima del umbral declarado de 0.60) y el escalon del ultimo ano previo al primero posterior es -2.29%. Es una DERIVA de varios anos que el corte parte por la mitad, no un salto atribuible a lo que paso en enero de 2024. El contraste pre/post mide la pendiente acumulada; leerlo como efecto del mecanismo seria atribuirle credito ajeno."}}, "caveats": [{"key": "sesiones_desiguales", "title": "Las tres sesiones no duran lo mismo", "text": "Cortar el dia por aperturas reales da tramos de 7 h (asiática), 6 h (europea), 11 h (estadounidense). Una cuota bruta mayor puede significar solo 'dura mas'. Por eso toda cuota va acompanada de su intensidad (cuota / fraccion de reloj), que es lo unico comparable entre tramos; 1,0 es neutro."}, {"key": "solape_de_sesiones", "title": "Las sesiones reales se solapan; la particion no puede", "text": "Londres y Nueva York coinciden varias horas al dia, y ese solape es precisamente el tramo mas activo del calendario financiero. Una particion exhaustiva y disjunta -que es lo que hace falta para que las cuotas sumen 1- tiene que asignar esas horas a UNA sesion. Aqui van a la estadounidense, porque el corte se pone en la apertura de EE.UU. La consecuencia es que la cuota estadounidense incorpora el solape y la europea no: es una decision, no una medida."}, {"key": "sin_horario_de_verano", "title": "Los cortes no se mueven con el horario de verano", "text": "Los mercados de referencia cambian de hora UTC dos veces al ano; los cortes de este estudio no. Desplazarlos haria que la serie de cuotas midiera tambien el calendario civil, y ademas la rejilla de velas del exchange es UTC fija. El coste es que durante el invierno del hemisferio norte la primera hora de cada sesion occidental cae en el tramo anterior; se ha elegido la frontera MAS TEMPRANA justo para que el error vaya en esa direccion y nunca en la contraria (una sesion no contiene la apertura de la siguiente)."}, {"key": "un_solo_exchange", "title": "Un solo exchange (binance) y un solo quote (USDT)", "text": "Todo esto es el libro de un exchange concreto en pares contra USDT. La distribucion horaria de la actividad puede diferir en plataformas con otra base de usuarios (una regulada en EE.UU. cargaria mas la sesion estadounidense por construccion). La cifra es del sustrato sobre el que el sistema opera y se backtestea, que es lo que se queria medir, pero no es 'el mercado' en abstracto."}, {"key": "cohorte_equilibrada", "title": "La tendencia se mide sobre una cohorte, no sobre el universo", "text": "10 de 24 pares cubren todos los anos de la ventana con al menos 240 dias utilizables. La serie anual y el contraste pre/post se calculan SOLO sobre ellos. Con el universo completo, la cuota de 2024 incorporaria pares que no existian en 2020 y la 'tendencia' seria en parte la historia de que se listo cuando. Los pares fuera de la cohorte se publican igual en la tabla por simbolo y ano."}, {"key": "sesgo_supervivencia", "title": "Sesgo de supervivencia", "text": "Los pares son los que cotizan HOY en el universo operable. Los deslistados entre 2020 y 2025 no estan. Para una descomposicion horaria el sesgo es menos grave que para un backtest -no se esta midiendo rentabilidad- pero sigue siendo un universo seleccionado por haber sobrevivido."}, {"key": "dias_incompletos", "title": "Los dias incompletos se caen enteros", "text": "Un dia entra solo si tiene sus 24 barras y ademas existe la de las 23:00 del dia anterior. Las paradas de mantenimiento del exchange tienden a caer en horas de poca actividad, asi que descartar el dia entero es mas conservador que rellenarlo: rellenar inventaria justo el dato que se quiere medir. Cada simbolo declara cuantos dias ha perdido."}, {"key": "no_es_causal", "title": "Esto describe cuando se mueve el precio, no por que", "text": "Una cuota horaria no identifica quien opera. Que la actividad se concentre en horario estadounidense es compatible con flujo institucional local, con el solape de Londres, con la publicacion de datos macro de EE.UU. y con que los tres coincidan. El estudio mide el CUANDO, que es lo que el motor necesita saber; el porque exigiria datos que no estan en una vela."}], "leader_variance": {"key": "us", "label": "Estadounidense", "value": 0.489}, "leader_sets_low": {"key": "us", "label": "Estadounidense", "value": 0.4766}, "us": {"abs_return": 0.4785, "variance": 0.489, "range": 0.4211, "range_vs_daily": 0.7242, "abs_intensity": 1.044, "variance_intensity": 1.067, "sets_high": 0.4506, "sets_low": 0.4766}, "us_key": "us", "generated_at": "2026-08-11"}, "activity": {"library": "ai_v3", "source": {"units": "data\\transfer\\units_ai_v3.json", "library_id": "ai_v3", "n_configs": 16, "cvar_alpha": 0.25, "blocks": {"real": 5, "synthetic": 8}, "windows_per_block": 15}, "floor": {"min_median_trades_per_window": 3.0, "max_zero_window_pct": 25.0, "derived": {"max_zero_window_pct": "es alpha en porcentaje: por encima de esa fraccion de ventanas vacias, el cuartil que promedia el CVaR puede estar hecho de ceros estructurales"}}, "mechanism": {"sides": {"real": {"windows": 1200, "empty_windows": 307, "empty_windows_scoring_exactly_zero": 307, "non_empty_windows_scoring_exactly_zero": 0, "holds": true, "cvar_tail_windows": 304, "cvar_tail_empty_windows": 37, "cvar_tail_empty_pct": 12.17, "spearman_reward_activity": -0.8353}, "synthetic": {"windows": 1920, "empty_windows": 256, "empty_windows_scoring_exactly_zero": 256, "non_empty_windows_scoring_exactly_zero": 0, "holds": true, "cvar_tail_windows": 480, "cvar_tail_empty_windows": 1, "cvar_tail_empty_pct": 0.21, "spearman_reward_activity": -0.1206}}}, "decision": {"rule": "el valor de la rejilla que reproduce con menos desacuerdos la condicion derivada (<
