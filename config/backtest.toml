# Configuracion de BACKTEST sobre mercado real.
#
# POR QUE EXISTE ESTE FICHERO, Y POR QUE ES UNA COPIA DE `default.toml`
# ----------------------------------------------------------------------
# Hasta el 2026-08-22, `config/default.toml` hacia dos trabajos: decia lo que se OPERA y
# decia lo que se MIDE. Funcionaba mientras las dos respuestas eran la misma. Dejo de
# funcionar el dia que la estrategia con prioridad forzada paso a ser `daily_report_expert`,
# que lee el reporte diario por activo y en backtest NO SE ENGANCHA a proposito: su archivo
# tiene tres dias y aplicar el reporte de hoy a una barra de 2023 seria look-ahead con otro
# nombre. Backtestearla da cero operaciones, que es correcto y es inutil.
#
# Asi que las dos respuestas se separan, siguiendo el precedente que ya abrio
# `config/synthetic.toml` el dia que el universo del generador dejo de coincidir con el
# universo operado:
#
#     config/default.toml    lo que OPERA hoy       -> daily_report_expert
#     config/backtest.toml   lo que se MIDE hoy     -> crypto_momentum (este fichero)
#     config/synthetic.toml  el universo del generador sintetico
#
# Se usa con:
#     ai-trader --config config/backtest.toml backtest ...
#
# Y es la referencia de los cinco casos de caracterizacion del CLI
# (`tests/test_characterization_cli.py`): son el unico sitio donde el pipeline entero
# --config, barras, estrategia, riesgo, ejecucion, metricas, score-- se recorre de punta a
# punta, y apuntarlos a una estrategia que no puede operar los dejaria en verde aunque el
# motor se rompiera entero.
#
# QUE SE PUEDE TOCAR AQUI. Nada, mientras los goldens sigan siendo la referencia: los
# parametros de `crypto_momentum` y el universo son EXACTAMENTE los que tenia
# `config/default.toml` antes del cambio, y cualquier retoque mueve las cifras congeladas.
# Si hay que cambiarlos, se regenera la referencia y se revisa el diff linea a linea.

# Universo de simbolos.
#   "BTC/USDT"  -> cripto (CCXT)
#   "AAPL"      -> renta variable (Alpaca; requiere ALPACA_API_KEY/SECRET)
#   "PM::<slug>"-> mercado de prediccion (Polymarket)
universe = [
  "BTC/USDT",
  "ETH/USDT",
  "SOL/USDT",
  "BNB/USDT",
  "XRP/USDT",
  "ADA/USDT",
  "DOGE/USDT",
  "AVAX/USDT",
  "DOT/USDT",
  "LINK/USDT",
  "LTC/USDT",
  "UNI/USDT",
  "ATOM/USDT",
  "NEAR/USDT",
  "APT/USDT",
  "ARB/USDT",
  "OP/USDT",
  "INJ/USDT",
  "FIL/USDT",
  "ETC/USDT",
  "AAVE/USDT",
  "SUI/USDT",
  "SEI/USDT",
  "TIA/USDT",
]
# Nota: MATIC/USDT se ha retirado de ESTE universo. Binance lo deslisto (ahora es POL),
# asi que fallaba en silencio en cada ciclo.
#
# Sigue presente, a proposito, en config/synthetic.toml y en el universo del generador
# (src/ai_trader/synthetic/universe.py): alli nada cotiza contra un exchange -el simbolo
# es solo la etiqueta de un perfil de cargas factoriales- y retirarlo desincronizaria la
# evidencia ya publicada sobre 35 activos. La nota completa esta en universe.py. La
# regla que hace consistentes los dos ficheros: este universo tiene que ser operable hoy;
# el sintetico tiene que coincidir con DEFAULT_UNIVERSE.

[runner]
lookback_days = 180
max_holding_days = 10
symbol_cooldown_hours = 12
max_trades_per_cycle = 5

[risk]
max_position_size_usd = 1000.0
max_open_positions = 5
max_symbol_exposure_usd = 2000.0
max_total_exposure_usd = 5000.0
max_daily_loss_usd = 200.0
min_confidence_per_trade = 0.65
# El motor de riesgo es el dueno de las salidas. La estrategia puede proponer un
# stop; si no lo hace, o si lo propone mas lejos de max_stop_distance_pct, manda esto.
default_stop_loss_pct = 5.0
default_take_profit_pct = 10.0
max_stop_distance_pct = 15.0

[execution]
fee_rate = 0.001
# Coste plano de REFERENCIA (bps): ya no lo cobra el motor de ejecucion, que usa el
# modelo de microestructura de abajo. Lo consumen los baselines pasivos y la auditoria
# de costes, que necesitan un numero unico y comparable.
slippage_bps = 5.0
# Techo de capacidad por barra: una orden no puede consumir mas de esta fraccion del
# volumen de la barra. Lo que exceda no se llena (fill parcial).
max_participation = 0.10

# Modelo de deslizamiento: medio spread del simbolo + vol_coef*sigma + impacto por raiz
# cuadrada de la participacion. Los spreads por simbolo viven en
# src/ai_trader/execution/microstructure.py; aqui solo se sobrescriben si hace falta.
[execution.slippage]
vol_coef = 0.02
impact_coef = 0.60
max_slippage_bps = 500.0

# Radar de senales externas. APAGADO por defecto: encenderlo hace que el sistema lea el
# archivo crudo de data/signals_raw/ y construya el bloque de observacion de senales
# (tono, intensidad y cobertura, por activo y de mercado).
#
# Con enabled = false el radar existe pero sale vacio: cobertura 0 y todas las puertas de
# senales se saltan solas. Sin credenciales, sin archivo o con medio catalogo caido, el
# arranque es el mismo; lo unico que cambia es cuanta cobertura hay, y eso se ve en el log.
#
# Aqui NO hay ningun umbral, y es deliberado: los pisos de tono, el minimo de cobertura y
# las escalas de las magnitudes son constantes razonadas en codigo para que no se puedan
# ajustar contra el resultado. Ver observation/signal_radar.py y signals/events.py.
[signals]
enabled = false

# Estrategias activas. `type` se resuelve contra el registro de strategies/registry.py.
# Este bloque es el formato que emitira el generador de estrategias con IA.
[[strategies]]
type = "crypto_momentum"
id = "crypto_momentum_v1"

[strategies.params]
fast_sma_window = 10
slow_sma_window = 20
atr_window = 14
breakout_lookback = 5
min_atr_pct = 0.2
risk_atr_multiple = 2.0
reward_atr_multiple = 3.0
require_breakout = true
