[tool.poetry]
name = "ai-trader"
version = "0.1.0"
description = "AI-driven paper trading system"
authors = ["Pelayo"]
packages = [{ include = "ai_trader", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
python-telegram-bot = { version = "^22.6", extras = ["job-queue"] }
python-dotenv = ">=1.2.1,<2.0.0"
ccxt = ">=4.5.42,<5.0.0"
pandas = ">=2.2,<4.0"
pyarrow = ">=15,<24"
alpaca-py = ">=0.43,<1.0"
numpy = ">=1.26,<3.0"
anthropic = ">=0.40,<1.0"

[tool.poetry.group.dev.dependencies]
watchfiles = ">=1.1.1,<2.0.0"
pytest = "^8.3"
ruff = "^0.8"

[tool.poetry.scripts]
ai-trader = "ai_trader.cli:main"
ai-trader-bot = "ai_trader.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"