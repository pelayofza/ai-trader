[tool.poetry]
name = "ai-trader"
version = "0.1.0"
description = "AI-driven paper trading system"
authors = ["Pelayo"]
packages = [{ include = "ai_trader", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
python-telegram-bot = {extras = ["job-queue"], version = "^22.6"}
python-dotenv = ">=1.2.1,<2.0.0"
ccxt = ">=4.5.42,<5.0.0"

[tool.poetry.group.dev.dependencies]
watchfiles = ">=1.1.1,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"